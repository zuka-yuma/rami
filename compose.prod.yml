services:
  db:
    image: postgres:18-alpine
    restart: always
    container_name: postgres
    env_file: ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5432:5432"

  migrate:
    build:
      context: ./server
      target: builder
    container_name: migrate
    env_file:
      - ./.env
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  server:
    build: ./server
    container_name: nodejs
    env_file:
      - ./.env
      - ./server/.env
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    container_name: vite
    env_file: ./.env
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - server
    volumes:
      - ./server/certs/cert.pem:/etc/nginx/certs/cert.pem
      - ./server/certs/cert-key.pem:/etc/nginx/certs/cert-key.pem

  backup:
    build: ./backup
    container_name: cron
    env_file:
      - ./.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backup:/app/backup

volumes:
  db:
  backup:
