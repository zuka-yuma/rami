apiVersion: v1
kind: ConfigMap
metadata:
  name: rami-config
  labels:
    app: rami
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # DB connection parts (shared by postgres and server)
  POSTGRES_USER: postgres
  POSTGRES_DB: rami
  # server runtime settings
  PORT: '3001'
  NODE_ENV: production
  MCP_TRANSPORT: http
