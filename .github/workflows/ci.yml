name: rami

on:
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_rami
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: ./server/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Generate prisma
      run: npx prisma generate
    - name: Run build
      run: npm run build
    - name: Run db migrate
      run: npm run testdb:migrate
    - name: Run test
      run: npm run test

  client-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: ./client/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Run build
      run: npm run build
    - name: Run test
      run: npm run test
