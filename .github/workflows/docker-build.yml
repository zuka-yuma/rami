name: rami

on:
  push:
    tags:
      - 'v*'

jobs:
  Image-build-amd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - stage: runner
            tag-name: rami-server
          - stage: builder
            tag-name: rami-migrate

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Make tag
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag-name }}
        flavor: suffix=-amd64
        tags: type=semver,pattern={{version}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: server
        target: ${{ matrix.stage }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        platforms: linux/amd64
        cache-from: type=gha,scope=amd-${{ matrix.tag-name }}
        cache-to: type=gha,scope=amd-${{ matrix.tag-name }},mode=max

  Image-build-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - stage: runner
            tag-name: rami-server
          - stage: builder
            tag-name: rami-migrate

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Make tag
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag-name }}
        flavor: suffix=-arm64
        tags: type=semver,pattern={{version}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: server
        target: ${{ matrix.stage }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        platforms: linux/arm64
        cache-from: type=gha,scope=arm-${{ matrix.tag-name }}
        cache-to: type=gha,scope=arm-${{ matrix.tag-name }},mode=max

  Image-merge:
    needs:
      - Image-build-amd
      - Image-build-arm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag-name: [ rami-server, rami-migrate ]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make tag
        id: sep
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.tag-name }}
          tags: type=semver,pattern={{version}}

      - name: Merge manifests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.sep.outputs.tags }} \
            ${{ steps.sep.outputs.tags }}-amd64 \
            ${{ steps.sep.outputs.tags }}-arm64
